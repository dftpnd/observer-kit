name: Offline contract status
"on":
  schedule:
    - cron: "0 17 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/redump_offsets.py --offline --dry-run
